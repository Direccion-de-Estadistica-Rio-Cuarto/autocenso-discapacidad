<html lang="es-AR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Relevamiento Discapacidad 2026</title>
<style>
:root{--bg:#f4f6f9;--card:#fff;--ink:#16202b;--muted:#46535f;--line:#c4cdd7;--brand:#1f4e79;--brand-ink:#fff;--accent:#e6eef7;--todo-bg:#fff1c2;--todo-ink:#4d3a00;--err:#b3261e;--focus:#f2a900;--ok:#1d6b3a;--fs:18px}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--bg:#0e1318;--card:#17202a;--ink:#e9eef3;--muted:#a8b5c2;--line:#34424f;--brand:#6aa6dc;--brand-ink:#0b1520;--accent:#1c2a39;--todo-bg:#433608;--todo-ink:#ffe28f;--err:#ff8f86;--ok:#86d9a1}}
:root[data-theme="dark"]{--bg:#0e1318;--card:#17202a;--ink:#e9eef3;--muted:#a8b5c2;--line:#34424f;--brand:#6aa6dc;--brand-ink:#0b1520;--accent:#1c2a39;--todo-bg:#433608;--todo-ink:#ffe28f;--err:#ff8f86;--ok:#86d9a1}
*{box-sizing:border-box}
html{font-size:var(--fs)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;line-height:1.5}
a{color:var(--brand)}
:focus-visible{outline:3px solid var(--focus);outline-offset:2px}
.skip{position:absolute;left:-999px}.skip:focus{left:8px;top:8px;background:var(--card);padding:8px;z-index:9}
header.top{background:var(--brand);color:var(--brand-ink);padding:14px 16px}
header.top .wrap{display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap}
header.top h1{font-size:1.05rem;margin:0;font-weight:700}
header.top p{margin:2px 0 0;font-size:.8rem;opacity:.9}
header.top p.piloto{display:inline-block;margin:0 0 6px;padding:2px 10px;border:2px solid currentColor;border-radius:4px;font-weight:800;letter-spacing:.06em;opacity:1}
.tools button{background:transparent;color:var(--brand-ink);border:1px solid currentColor;border-radius:6px;padding:4px 10px;font:inherit;font-size:.8rem;cursor:pointer;margin-left:4px}
.wrap{max-width:860px;margin:0 auto}
main{padding:16px}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:20px 18px;margin-bottom:16px}
.progress{font-size:.85rem;color:var(--muted);margin-bottom:8px;display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap}
.bar{height:6px;background:var(--line);border-radius:3px;overflow:hidden;margin-bottom:14px}.bar>i{display:block;height:100%;background:var(--brand)}
.person{display:inline-block;background:var(--accent);border:1px solid var(--line);border-radius:999px;padding:2px 12px;font-weight:600;font-size:.9rem;margin-bottom:8px}
h2{font-size:1.3rem;margin:.2rem 0 1rem;color:var(--brand)}
h3{font-size:1.05rem;margin:1.2rem 0 .4rem}
.intro{background:var(--accent);border-radius:8px;padding:12px 14px;margin-bottom:16px;font-size:.95rem}
.intro p{margin:.4rem 0}
.q{border-top:1px solid var(--line);padding:16px 0}
.q:first-of-type{border-top:0}
fieldset{border:0;margin:0;padding:0;min-width:0}
legend,.qlabel{font-weight:600;margin-bottom:6px;display:block;padding:0}
.num{display:inline-block;min-width:2.4em;color:var(--brand)}
.hint{color:var(--muted);font-size:.85rem;margin:2px 0 8px}
.opt{display:flex;gap:10px;align-items:flex-start;padding:6px 8px;border-radius:6px;cursor:pointer}
.opt:hover{background:var(--accent)}
.opt input{width:1.2rem;height:1.2rem;margin-top:.2rem;flex:none;accent-color:var(--brand)}
.opt small{display:block;color:var(--muted)}
.matrix .opts{display:flex;flex-wrap:wrap;gap:4px}
.matrix .opt{border:1px solid var(--line);flex:1 1 150px}
input[type=text],input[type=tel],input[type=email],input[type=number],input[type=date],input[type=month],select,textarea{font:inherit;color:var(--ink);background:var(--card);border:2px solid var(--line);border-radius:6px;padding:8px 10px;width:100%;max-width:520px}
textarea{min-height:140px;max-width:100%}
dialog#ayuda{border:1px solid var(--line);border-radius:12px;padding:0;max-width:680px;width:calc(100% - 32px);max-height:calc(100% - 48px);background:var(--card);color:var(--ink)}
dialog#ayuda::backdrop{background:rgba(0,0,0,.55)}
.dlg-head{position:sticky;top:0;background:var(--card);display:flex;justify-content:space-between;align-items:center;gap:12px;padding:14px 18px;border-bottom:1px solid var(--line)}
.dlg-head h2{margin:0;font-size:1.1rem}
.dlg-body{padding:6px 18px 18px;font-size:.95rem}
.piloto-c{display:inline-block;margin:0 0 10px;padding:2px 10px;border:2px solid var(--brand);color:var(--brand);border-radius:4px;font-weight:800;letter-spacing:.06em;font-size:.85rem}
@media print{.piloto-c{border-color:#000;color:#000}}
.combo{position:relative;max-width:520px}
.lb{position:absolute;left:0;right:0;top:100%;z-index:5;margin:2px 0 0;padding:4px 0;list-style:none;background:var(--card);border:2px solid var(--brand);border-radius:6px;max-height:260px;overflow:auto;box-shadow:0 6px 18px rgba(0,0,0,.18)}
.lb li{padding:8px 12px;cursor:pointer}
.lb li[aria-selected=true],.lb li:hover{background:var(--brand);color:var(--brand-ink)}
.otro{margin:6px 0 0 36px}
.otro label{font-size:.9rem;display:block}
.err{color:var(--err);font-weight:600;font-size:.9rem;margin-top:6px}
.q.invalid input,.q.invalid select,.q.invalid textarea{border-color:var(--err)}
.summary{border:2px solid var(--err);border-radius:8px;padding:10px 14px;margin-bottom:14px}
.summary h3{margin:0 0 4px;color:var(--err)}
.nav{display:flex;gap:10px;justify-content:space-between;flex-wrap:wrap;margin-top:8px}
button.btn{font:inherit;font-weight:600;border-radius:8px;padding:10px 20px;cursor:pointer;border:2px solid var(--brand)}
.btn.primary{background:var(--brand);color:var(--brand-ink)}
.btn.sec{background:transparent;color:var(--brand)}
.btn.small{padding:4px 12px;font-size:.85rem;font-weight:500}
mark.todo{background:var(--todo-bg);color:var(--todo-ink);padding:0 3px;border-radius:3px;font-weight:600}
table{border-collapse:collapse;width:100%;font-size:.88rem;margin:8px 0}
th,td{border:1px solid var(--line);padding:6px 8px;text-align:left;vertical-align:top}
th{background:var(--accent)}
.tablewrap{overflow-x:auto}
.box{border:1px solid var(--line);border-radius:8px;padding:12px 14px;margin:12px 0}
.box h3{margin-top:0}
.code{font-family:ui-monospace,Consolas,monospace;font-size:1.3rem;font-weight:700;letter-spacing:.06em}
.ok{color:var(--ok)}
[hidden]{display:none!important}
@media print{header.top,.nav,.noprint,#app{display:none!important}body{background:#fff;color:#000}.card{border:0}}
</style>
</head>

/* ============ estado y navegación ============ */
const STATE = { h: {}, p: [], meta: {} };

function nPersons() { const n = parseInt(STATE.h.hogar_pcd, 10); return n >= 1 && n <= 10 ? n : 1; }
function pageList() {
  const list = PAGES.slice(); const n = nPersons();
  for (let i = 0; i < n; i++) PERSON_PAGES.forEach(pg => list.push({ ...pg, idx: i }));
  list.push(PAGE_C); return list;

function ctxFor(pg) {
  const idx = pg.idx ?? 0; const p = STATE.p[idx] || (STATE.p[idx] = {});
  return { idx, n: nPersons(), age: ageOf(p.nacimiento), usted: STATE.h.quien === 'La propia persona en situación de discapacidad' };
}
const scopeObj = pg => pg.scope === 'p' ? (STATE.p[pg.idx] || (STATE.p[pg.idx] = {})) : STATE.h;
const pageOn = pg => !pg.when || pg.when(STATE.h, scopeObj(pg), ctxFor(pg));
const qOn = (q, pg) => !q.when || q.when(STATE.h, scopeObj(pg), ctxFor(pg));
const optsOf = q => (typeof q.opts === 'function' ? q.opts() : q.opts || []).map(norm);

let PAGE, QS;
function render() {
  const list = pageList(); PAGE = list[cur]; QS = PAGE.qs;
  const visible = list.filter(pageOn); const pos = visible.indexOf(PAGE) + 1;
  const c = ctxFor(PAGE); const S = scopeObj(PAGE);
  let html = `<div class="card"><div class="progress"><span>${esc(PAGE.part || 'Inicio')}</span><span>Paso ${pos} de ${visible.length}</span></div>
    <div class="bar" aria-hidden="true"><i style="width:${Math.round(pos / visible.length * 100)}%"></i></div>`;
  if (PAGE.scope === 'p') html += `<div class="person">Persona ${c.idx + 1} de ${c.n}${S.nombre ? ' · ' + esc(S.nombre) : ''}</div>`;
  html += `<h2 tabindex="-1" id="ptitle">${esc(PAGE.title)}</h2><div id="errsum" role="alert"></div>`;
  if (PAGE.intro) html += PAGE.introRaw ? mk(PAGE.intro) : `<div class="intro">${mk(PAGE.intro)}</div>`;
  html += `<form id="f" novalidate>`;
  QS.forEach((q, i) => html += renderQ(q, i, c));
  html += `</form><div class="nav">${cur > 1 ? '<button type="button" class="btn sec" id="back">Anterior</button>' : '<span></span>'}
    <button type="button" class="btn primary" id="next">${cur === 0 ? 'Comenzar' : (PAGE.id === 'b13' ? 'Enviar' : 'Siguiente')}</button></div></div>`;
  app.innerHTML = html;
  QS.forEach((q, i) => { if (q.var) setDom(q, i, S[q.var], S[q.var + '_otro']); if (q.type === 'street') initStreet(q, i); });
  refresh();
  const f = document.getElementById('f');
  f.addEventListener('change', onChange); f.addEventListener('input', onInput);
  f.addEventListener('click', e => { const b = e.target.closest('[data-copy]'); if (b) copyPrev(+b.dataset.copy); });
  document.getElementById('next').onclick = next;
  const b = document.getElementById('back'); if (b) b.onclick = back;
  document.getElementById('ptitle').focus(); window.scrollTo(0, 0);
}

function renderQ(q, i, c) {
  if (q.type === 'info') return `<div class="q" data-i="${i}">${mk(q.html(c))}</div>`;
  const id = 'q' + i; const hint = q.hint ? `<p class="hint" id="${id}h">${mk(q.hint)}</p>` : '';
  const num = `<span class="num">${esc(q.n)}.</span>`;
  const desc = `aria-describedby="${q.hint ? id + 'h ' : ''}${id}e"`;
  const copy = q.copyPrev && c.idx > 0 ? `<button type="button" class="btn sec small noprint" data-copy="${i}">Igual que la persona anterior</button>` : '';
  const req = q.optional ? '' : ' aria-required="true"';
  let body = '';
  if (q.type === 'radio' || q.type === 'checks') {
    const t = q.type === 'radio' ? 'radio' : 'checkbox';
    const opts = optsOf(q); let other = null;
    body = `<fieldset${q.matrix ? ' class="matrix"' : ''} ${desc}${q.type === 'radio' ? ' role="radiogroup"' + req : ''}><legend>${num}${esc(q.label)}</legend>${hint}${copy}<div class="opts">` +
      opts.map((o, k) => { if (o.other) other = o; return `<label class="opt" data-o="${k}"><input type="${t}" name="${q.var}" value="${esc(o.v)}"><span>${esc(o.label || o.v)}${o.d ? `<small>${esc(o.d)}</small>` : ''}</span></label>`; }).join('') +
      `</div>${other ? otherBox(q, other) : ''}</fieldset>`;
  } else if (q.type === 'select') {
    const opts = optsOf(q); const other = opts.find(o => o.other);
    const hasReal = opts.some(o => !o.other);
    body = `<label class="qlabel" for="${id}">${num}${esc(q.label)}</label>${hint}<select id="${id}" name="${q.var}" ${desc}${req}><option value="">Seleccioná una opción</option>` +
      (q.var === 'barrio' && !LISTAS.barrios.length ? `<option value="" disabled>[COMPLETAR (Estadística): un barrio por línea, según listado oficial]</option>` : '') +
      opts.map((o, k) => `<option value="${esc(o.v)}" data-o="${k}">${esc(o.label || o.v)}</option>`).join('') + `</select>${other ? otherBox(q, other) : ''}`;
    void hasReal;
  } else if (q.type === 'consent') {
    body = `<label class="opt"><input type="checkbox" id="${id}" name="${q.var}" ${desc}${req}><span>${num}${esc(q.label)}</span></label>`;
  } else if (q.type === 'textarea') {
    body = `<label class="qlabel" for="${id}">${num}${esc(q.label)}</label>${hint}<textarea id="${id}" name="${q.var}" ${desc}></textarea>`;
  } else if (q.type === 'month') {
    body = `<label class="qlabel" for="${id}">${num}${esc(q.label)}</label>${hint}<input type="month" id="${id}" name="${q.var}" placeholder="AAAA-MM" ${desc}>
      <label class="opt"><input type="checkbox" name="${q.var}__ns"><span>${esc(q.unknown)}</span></label>`;
  } else if (q.type === 'street') {
    body = `<label class="qlabel" for="${id}">${num}${esc(q.label)}</label>${hint}<div class="combo">
      <input type="text" id="${id}" name="${q.var}" role="combobox" aria-autocomplete="list" aria-expanded="false" aria-controls="${id}lb" autocomplete="off" spellcheck="false" ${desc}${req}>
      <ul id="${id}lb" role="listbox" class="lb" aria-label="Calles sugeridas" hidden></ul></div>
      <p class="hint" id="${id}st" aria-live="polite"></p>
      <label class="opt"><input type="checkbox" name="${q.var}__nl"><span>Mi calle no está en el listado</span></label>`;
  } else {
    const type = { text: 'text', tel: 'tel', email: 'email', number: 'number', date: 'date' }[q.type];
    const extra = (q.min != null ? ` min="${q.min}"` : '') + (q.max != null ? ` max="${q.max}"` : '') + (q.inputmode ? ` inputmode="${q.inputmode}"` : (q.type === 'number' ? ' inputmode="numeric"' : '')) +
      (q.type === 'date' ? ` max="${new Date().toISOString().slice(0, 10)}"` : '') + (q.type === 'email' ? ' autocomplete="email"' : '') + (q.type === 'tel' ? ' autocomplete="tel"' : '');
    body = `<label class="qlabel" for="${id}">${num}${esc(q.label)}</label>${hint}<input type="${type}" id="${id}" name="${q.var}"${extra} ${desc}${req}>` +
      (q.unknown ? `<label class="opt"><input type="checkbox" name="${q.var}__ns"><span>${esc(q.unknown)}</span></label>` : '');
  }
  return `<div class="q" data-i="${i}">${body}<div class="err" id="${id}e"></div></div>`;
}
const otherBox = (q, o) => `<div class="otro" hidden><label for="${q.var}__otro">${esc(o.otherLabel || 'Indique cuál')} (obligatorio)</label><input type="text" id="${q.var}__otro" name="${q.var}__otro"></div>`;

/* ---- buscador de calles (combobox accesible) ---- */
const normS = s => String(s).normalize('NFD').replace(/[̀-ͯ]/g, '').toUpperCase().replace(/[.,\-()]/g, ' ').replace(/\s+/g, ' ').trim();
const CALLES_N = LISTAS.calles.map(c => [c, normS(c)]);
function streetMatch(t) { const n = normS(t); if (!n) return ''; const f = CALLES_N.find(x => x[1] === n); return f ? f[0] : ''; }
function initStreet(q, i) {
  const w = wrapOf(i); const inp = w.querySelector('[role=combobox]'); const lb = w.querySelector('[role=listbox]');
  const st = w.querySelector(`#q${i}st`); const nl = w.querySelector(`input[name="${q.var}__nl"]`);
  let items = [], act = -1;
  const close = () => { lb.hidden = true; inp.setAttribute('aria-expanded', 'false'); inp.removeAttribute('aria-activedescendant'); act = -1; };
  const choose = k => { inp.value = items[k]; close(); readQ(q, i); refresh(); showErr(i, ''); st.textContent = 'Calle seleccionada: ' + items[k] + '.'; };
  const setAct = k => {
    act = k; [...lb.children].forEach((li, j) => li.setAttribute('aria-selected', j === k ? 'true' : 'false'));
    if (k >= 0) { const li = lb.children[k]; inp.setAttribute('aria-activedescendant', li.id); li.scrollIntoView({ block: 'nearest' }); }
  };
  const update = () => {
    if (nl.checked) { close(); st.textContent = ''; return; }
    const n = normS(inp.value); if (!n) { close(); st.textContent = ''; return; }
    const toks = n.split(' ');
    const m = CALLES_N.filter(x => toks.every(t => x[1].includes(t)));
    m.sort((a, b) => ((b[1] === n) - (a[1] === n)) || (b[1].startsWith(n) - a[1].startsWith(n)) || a[1].localeCompare(b[1], 'es'));
    items = m.slice(0, 50).map(x => x[0]);
    lb.innerHTML = items.map((c, k) => `<li role="option" id="q${i}o${k}" aria-selected="false">${esc(c)}</li>`).join('');
    lb.hidden = !items.length; inp.setAttribute('aria-expanded', items.length ? 'true' : 'false'); act = -1;
    st.textContent = items.length ? `${m.length} ${m.length === 1 ? 'calle encontrada' : 'calles encontradas'}${m.length > 50 ? ' (se muestran 50: siga escribiendo para acotar)' : ''}. Use las flechas y Enter para elegir.`
      : 'No se encontraron calles con ese nombre. Revise lo escrito o marque «Mi calle no está en el listado».';
  };
  inp.addEventListener('input', update);
  inp.addEventListener('keydown', e => {
    if (lb.hidden) { if (e.key === 'ArrowDown') { update(); if (!lb.hidden) { e.preventDefault(); setAct(0); } } return; }
    if (e.key === 'ArrowDown') { e.preventDefault(); setAct(Math.min(items.length - 1, act + 1)); }
    else if (e.key === 'ArrowUp') { e.preventDefault(); setAct(Math.max(0, act - 1)); }
    else if (e.key === 'Enter') { e.preventDefault(); if (act >= 0) choose(act); else if (items.length === 1) choose(0); }
    else if (e.key === 'Escape') { e.preventDefault(); close(); }
  });
  lb.addEventListener('mousedown', e => { const li = e.target.closest('[role=option]'); if (li) { e.preventDefault(); choose([...lb.children].indexOf(li)); } });
  inp.addEventListener('blur', () => setTimeout(close, 150));
  nl.addEventListener('change', () => { if (nl.checked) { close(); st.textContent = 'Escriba el nombre de la calle tal como lo conoce.'; } else update(); });
}

function wrapOf(i) { return app.querySelector(`.q[data-i="${i}"]`); }
function readQ(q, i) {
  const w = wrapOf(i); const S = scopeObj(PAGE); let v;
  if (q.type === 'radio') v = (w.querySelector(`input[name="${q.var}"]:checked`) || {}).value;
  else if (q.type === 'checks') v = [...w.querySelectorAll(`input[name="${q.var}"]:checked`)].map(x => x.value);
  else if (q.type === 'consent') v = w.querySelector('input').checked;
  else if (q.type === 'month') { const ns = w.querySelector(`input[name="${q.var}__ns"]`); const m = w.querySelector('input[type=month]'); m.disabled = ns.checked; v = ns.checked ? q.unknown : m.value.trim(); }
  else if (q.type === 'street') {
    const t = w.querySelector(`[name="${q.var}"]`).value.trim(); const nl = w.querySelector(`input[name="${q.var}__nl"]`).checked;
    v = nl ? t : streetMatch(t);
    if (nl) S[q.var + '_nolistada'] = true; else delete S[q.var + '_nolistada'];
  }
  else if (q.unknown) { const ns = w.querySelector(`input[name="${q.var}__ns"]`); const inp = w.querySelector(`[name="${q.var}"]`); inp.disabled = ns.checked; v = ns.checked ? q.unknown : inp.value.trim(); }
  else v = (w.querySelector(`[name="${q.var}"]`).value || '').trim();
  if (empty(v)) delete S[q.var]; else S[q.var] = v;
  const ob = w.querySelector('.otro');
  if (ob) {
    const otherOpt = optsOf(q).find(o => o.other); const sel = Array.isArray(v) ? has(v, otherOpt.v) : v === otherOpt.v;
    ob.hidden = !sel; const t = ob.querySelector('input').value.trim();
    if (sel && t) S[q.var + '_otro'] = t; else delete S[q.var + '_otro'];
    if (!sel) ob.querySelector('input').value = '';
  }
  if (q.type === 'consent' && v) S[q.var + '_fecha_hora'] = new Date().toISOString(); else if (q.type === 'consent') delete S[q.var + '_fecha_hora'];
}
function setDom(q, i, v, otro) {
  const w = wrapOf(i); if (!w) return;
  if (q.type === 'radio' || q.type === 'checks') w.querySelectorAll(`input[name="${q.var}"]`).forEach(x => x.checked = Array.isArray(v) ? v.includes(x.value) : x.value === v);
  else if (q.type === 'consent') w.querySelector('input').checked = !!v;
  else if (q.type === 'month') { const ns = w.querySelector(`input[name="${q.var}__ns"]`); const m = w.querySelector('input[type=month]'); ns.checked = v === q.unknown; m.disabled = ns.checked; m.value = v && v !== q.unknown ? v : ''; }
  else if (q.type === 'street') { w.querySelector(`[name="${q.var}"]`).value = v ?? ''; w.querySelector(`input[name="${q.var}__nl"]`).checked = !!scopeObj(PAGE)[q.var + '_nolistada']; }
  else if (q.unknown) { const ns = w.querySelector(`input[name="${q.var}__ns"]`); const inp = w.querySelector(`[name="${q.var}"]`); ns.checked = v === q.unknown; inp.disabled = ns.checked; inp.value = v && v !== q.unknown ? v : ''; }
  else { const el = w.querySelector(`[name="${q.var}"]`); el.value = v ?? ''; }
  const ob = w.querySelector('.otro'); if (ob) { ob.querySelector('input').value = otro || ''; const oo = optsOf(q).find(o => o.other); ob.hidden = !(Array.isArray(v) ? has(v, oo.v) : v === oo.v); }
}

function refresh() {
  const S = scopeObj(PAGE); const c = ctxFor(PAGE);
  for (let pass = 0; pass < 3; pass++) {
    QS.forEach((q, i) => {
      const w = wrapOf(i); const on = qOn(q, PAGE); w.hidden = !on;
      if (!on && q.var && (S[q.var] !== undefined || S[q.var + '_otro'] !== undefined)) { delete S[q.var]; delete S[q.var + '_otro']; delete S[q.var + '_fecha_hora']; setDom(q, i, undefined, ''); }
      if (on && q.opts) {
        let changed = false;
        optsOf(q).forEach((o, k) => {
          if (!o.when) return; const ok = o.when(STATE.h, S, c);
          w.querySelectorAll(`[data-o="${k}"]`).forEach(el => {
            el.hidden = !ok;
            if (el.tagName === 'OPTION') { el.disabled = !ok; if (!ok && el.selected) { el.parentNode.value = ''; changed = true; } }
            else { const inp = el.querySelector('input'); if (!ok && inp.checked) { inp.checked = false; changed = true; } }
          });
        });
        if (changed) readQ(q, i);
      }
    });
  }
}

function onChange(e) {
  const w = e.target.closest('.q'); if (!w) return; const i = +w.dataset.i; const q = QS[i]; if (!q || !q.var) return;
  if (q.type === 'checks' && e.target.name === q.var && e.target.checked) {
    const boxes = [...w.querySelectorAll(`input[name="${q.var}"]`)]; const opts = optsOf(q);
    const o = opts.find(x => x.v === e.target.value);
    if (o.excl) boxes.forEach(b => { if (b !== e.target) b.checked = false; });
    else boxes.forEach(b => { const ob = opts.find(x => x.v === b.value); if (ob.excl) b.checked = false; });
    if (q.max && boxes.filter(b => b.checked).length > q.max) { e.target.checked = false; showErr(i, `Puede elegir hasta ${q.max} opciones.`); }
    else showErr(i, '');
  }
  readQ(q, i); refresh();
}
function onInput(e) {
  const w = e.target.closest('.q'); if (!w) return; const q = QS[+w.dataset.i];
  if (q && q.var && !['radio', 'checks', 'consent'].includes(q.type) || e.target.name.endsWith('__otro')) { readQ(q, +w.dataset.i); refresh(); }
}
function copyPrev(i) {
  const q = QS[i]; const prev = STATE.p[PAGE.idx - 1] || {}; const S = scopeObj(PAGE);
  if (prev[q.var] === undefined) { showErr(i, 'La persona anterior no tiene esta respuesta cargada.'); return; }
  S[q.var] = JSON.parse(JSON.stringify(prev[q.var])); if (prev[q.var + '_otro']) S[q.var + '_otro'] = prev[q.var + '_otro'];
  setDom(q, i, S[q.var], S[q.var + '_otro']); showErr(i, ''); refresh();
}
function showErr(i, msg) { const w = wrapOf(i); if (!w) return; w.querySelector('.err').textContent = msg; w.classList.toggle('invalid', !!msg); }

function validate() {
  const S = scopeObj(PAGE); const c = ctxFor(PAGE); const errs = [];
  QS.forEach((q, i) => {
    if (!q.var || !qOn(q, PAGE)) return; let msg = '';
    const v = S[q.var];
    if (!q.optional && empty(v)) msg = q.type === 'consent' ? 'Debe marcar esta casilla para continuar.'
      : (q.type === 'street' && wrapOf(i).querySelector('[role=combobox]').value.trim() ? 'Elija la calle de la lista de sugerencias, o marque «Mi calle no está en el listado».' : 'Esta pregunta es obligatoria.');
    else if (!empty(v)) {
      const oo = q.opts && optsOf(q).find(o => o.other);
      if (oo && (Array.isArray(v) ? has(v, oo.v) : v === oo.v) && !S[q.var + '_otro']) msg = 'Complete el campo “' + (oo.otherLabel || 'Indique cuál') + '”.';
      else if (q.validate) msg = q.validate(v, STATE.h, S, c) || '';
    } else if (q.validate && q.optional && q.type !== 'checks') msg = q.validate(v || '', STATE.h, S, c) || '';
    showErr(i, msg); if (msg) errs.push([i, q, msg]);
  });
  const box = document.getElementById('errsum');
  if (errs.length) {
    box.innerHTML = `<div class="summary"><h3>Revise ${errs.length === 1 ? 'esta respuesta' : 'estas ' + errs.length + ' respuestas'}</h3><ul>` +
      errs.map(([i, q, m]) => `<li><a href="#q${i}" data-go="${i}">Pregunta ${esc(q.n)}: ${esc(m)}</a></li>`).join('') + '</ul></div>';
    box.querySelectorAll('[data-go]').forEach(a => a.onclick = ev => { ev.preventDefault(); const w = wrapOf(+a.dataset.go); const f = w.querySelector('input,select,textarea'); w.scrollIntoView({ block: 'center' }); if (f) f.focus(); });
    box.querySelector('a').focus();
    return false;
  }
  box.innerHTML = ''; return true;
}

function next() {
  if (!validate()) return;
  if (PAGE.id === 'b2' && STATE.h.reside === 'No') return closed();
  if (PAGE.id === 'b2') STATE.p.length = Math.min(STATE.p.length, nPersons());
  const list = pageList();
  if (PAGE.id === 'b13') return finish();
  let k = cur + 1; while (k < list.length && !pageOn(list[k])) k++;
  cur = k; render();
}
function back() { const list = pageList(); let k = cur - 1; while (k > 1 && !pageOn(list[k])) k--; cur = Math.max(1, k); render(); }

function closed() {
  app.innerHTML = `<div class="card"><h2 tabindex="-1" id="ptitle">Gracias por su interés</h2>
    <p>Este relevamiento es para residentes de la ciudad de Río Cuarto.</p>
    <div class="box"><h3>Dirección de Estadística, Control de Calidad y Procesos</h3><p>${esc(LISTAS.inclusion)}</p></div>
    <div class="nav"><button type="button" class="btn sec" id="back">Volver</button></div></div>`;
  document.getElementById('back').onclick = () => render();
  document.getElementById('ptitle').focus();
}

/* ============ cálculo, registro y constancia ============ */
const REGISTRO_VARS = ['quien_nombre', 'quien_dni', 'quien_vinculo', 'quien_vinculo_otro', 'domicilio', 'domicilio_calle', 'domicilio_calle_nolistada', 'domicilio_altura', 'telefono', 'correo', 'nombre', 'doc_numero'];
function calc(p) {
  const edad = ageOf(p.nacimiento); const criterios = [];
  if (edad !== null && edad >= 18 && ['wg_ver', 'wg_oir', 'wg_caminar', 'wg_recordar', 'wg_cuidado', 'wg_comunicar'].some(k => p[k] === 'Tiene mucha dificultad' || p[k] === 'Le resulta imposible')) criterios.push('funcional');
  if (p.cud === 'Sí') criterios.push('CUD');
  if (p.cud === 'En trámite') criterios.push('CUD en trámite');
  if (p.diagnostico === 'Sí') criterios.push('diagnóstico');
  let vig = null;
  if (p.cud === 'Sí') {
    if (!p.cud_venc || p.cud_venc === 'No lo sé') vig = 'sin dato';
    else { const [y, m] = p.cud_venc.split('-').map(Number); const end = new Date(y, m, 0, 23, 59); const now = new Date(); const d = (end - now) / 864e5; vig = d < 0 ? 'vencido' : (d <= 90 ? 'por vencer' : 'vigente'); }
  }
  const at = p.apoyo_tipos || [];
  const apoyo_recibe = !at.length ? null : (has(at, 'Ninguno') ? 'No' : (has(at, 'No sabe / no puede precisar') ? 'No sabe / no puede precisar' : 'Sí'));
  return {
    edad, apoyo_recibe, criterio_inclusion: criterios[0] || 'fuera de criterio', criterios_cumplidos: criterios, vigencia_cud: vig,
    tipo_disc_multiple: Array.isArray(p.tipo_disc) ? p.tipo_disc.filter(x => x !== 'No sabe / No responde').length >= 2 : false,
    funcional_infantil: edad !== null && edad >= 2 && edad <= 17 ? 'pendiente: módulo infantil no cargado' : undefined
  };
}
function split(obj) {
  const reg = {}, est = {};
  Object.entries(obj).forEach(([k, v]) => (REGISTRO_VARS.includes(k) ? reg : est)[k] = v);
  return [reg, est];
}
function rnd(n) { const a = new Uint8Array(n); crypto.getRandomValues(a); return [...a].map(b => 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789'[b % 32]).join(''); }

function finish() {
  const now = new Date(); const codigo = 'RSD-' + rnd(4) + '-' + rnd(4); const idInterno = rnd(12);
  const [hReg, hEst] = split(STATE.h);
  if (CANAL_URL) hEst.canal = CANAL_URL;
  hReg.domicilio = [STATE.h.domicilio_calle, STATE.h.domicilio_altura === 'Sin número' ? 'S/N' : STATE.h.domicilio_altura].filter(Boolean).join(' ');
  const personas = STATE.p.slice(0, nPersons()).map((p, i) => { const [r, e] = split(p); return { reg: { persona: i + 1, ...r }, est: { persona: i + 1, ...e, ...calc(p) } }; });
  const record = {
    meta: { codigo, fecha_hora: now.toISOString(), version_formulario: 'v3', version_consentimiento: CONSENT_VERSION, canal_desde_enlace: !!CANAL_URL },
    registro: { id_interno: idInterno, ...hReg, personas: personas.map(x => x.reg) },
    estadistica: { id_interno: idInterno, hogar: hEst, personas: personas.map(x => x.est) }
  };
  window.__RECORD = record;
  const quien = STATE.h.quien === 'La propia persona en situación de discapacidad' ? (STATE.p[0] || {}).nombre : STATE.h.quien_nombre;
  const contactos = [{ t: 'Departamento de Inclusión', c: LISTAS.inclusion }];
  const elegidos = new Set(); STATE.p.forEach(p => (p.prog_interes || []).forEach(v => elegidos.add(v)));
  PROGRAMAS.forEach(pr => { if (elegidos.has(pr.v) && pr.v !== 'Departamento de Inclusión') contactos.push({ t: pr.v, c: pr.contacto || '[COMPLETAR (Subsecretaría): contacto]' }); });
  if (STATE.p.some(p => p.lab_sit === 'No trabaja y busca trabajo (desocupado/a)') && !elegidos.has('Departamento de Inclusión Laboral')) {
    const il = PROGRAMAS.find(p => p.v === 'Departamento de Inclusión Laboral'); contactos.push({ t: il.v, c: il.contacto });
  }
  app.hidden = true; const fin = document.getElementById('fin'); fin.hidden = false;
  fin.innerHTML = `<div class="card" id="constancia"><p class="piloto-c">PRUEBA PILOTO PRELIMINAR · CONFIDENCIAL</p><h2 tabindex="-1" id="ftitle"><span class="ok">✓</span> Formulario enviado</h2>
    <p>Gracias por participar del Relevamiento Situacional Autogestionado de Personas en Situación de Discapacidad 2026.</p>
    <div class="box"><h3>Constancia</h3>
      <p>Código: <span class="code">${codigo}</span></p>
      <p>Fecha y hora: ${now.toLocaleString('es-AR')}</p>
      <p>Completado por: ${esc(quien || '')}</p>
      <p>Personas cargadas: ${personas.length} — ${STATE.p.slice(0, nPersons()).map(p => esc(p.nombre || '')).join(', ')}</p></div>
    <h3>Contactos</h3>${contactos.map(x => `<div class="box"><strong>${esc(x.t)}</strong><p>${mk(esc(x.c))}</p></div>`).join('')}
    <p class="hint noprint">El envío de la constancia por correo y el guardado en el almacenamiento cifrado requieren el servidor del relevamiento ${mk('[COMPLETAR (Estadística): proveedor, ubicación y mecanismo de cifrado]')}. En esta versión, las respuestas se pueden descargar.</p>
    <div class="nav noprint"><button type="button" class="btn sec" id="print">Imprimir o guardar constancia</button><button type="button" class="btn primary" id="dl">Descargar respuestas (JSON)</button></div></div>`;
  document.getElementById('print').onclick = () => window.print();
  document.getElementById('dl').onclick = () => {
    const blob = new Blob([JSON.stringify(record, null, 2)], { type: 'application/json' });
    const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = codigo + '.json'; document.body.appendChild(a); a.click(); a.remove();
  };
  document.getElementById('ftitle').focus(); window.scrollTo(0, 0);
}

/* ============ accesibilidad: tamaño de letra y contraste ============ */
(function () {
  let fs = 18; const set = () => document.documentElement.style.setProperty('--fs', fs + 'px');
  document.getElementById('fsUp').onclick = () => { fs = Math.min(28, fs + 2); set(); };
  document.getElementById('fsDown').onclick = () => { fs = Math.max(14, fs - 2); set(); };
  document.getElementById('themeBtn').onclick = () => {
    const r = document.documentElement; const dark = r.dataset.theme ? r.dataset.theme === 'dark' : matchMedia('(prefers-color-scheme: dark)').matches;
    r.dataset.theme = dark ? 'light' : 'dark';
  };
})();

/* ============ modal de ayuda e información ============ */
(function () {
  const dlg = document.getElementById('ayuda'); let opener = null;
  document.getElementById('ayudaB').innerHTML = mk(AYUDA + ESTANDARES);
  document.addEventListener('click', e => { const b = e.target.closest('[data-ayuda]'); if (b) { opener = b; dlg.showModal(); document.getElementById('ayudaX').focus(); } });
  document.getElementById('ayudaX').onclick = () => dlg.close();
  dlg.addEventListener('click', e => { if (e.target === dlg) dlg.close(); });
  dlg.addEventListener('close', () => { if (opener && document.contains(opener)) opener.focus(); });
})();

render();
</script>
